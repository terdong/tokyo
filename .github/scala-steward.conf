# 1. Group updates
pullRequests.grouping = [
  {
    name = "kyo-updates",
    title = "Kyo Library Updates",
    filter = [{"group" = "io.getkyo", "artifactId" = "kyo-core"}]
  },
  {
    name = "scalajs-updates",
    title = "ScalaJS Plugin Updates",
    filter = [{"group" = "org.scala-js", "artifactId" = "sbt-scalajs"}]
  },
  {
    name = "crossproject-updates",
    title = "CrossProject Plugin Updates",
    filter = [{"group" = "org.portable-scala", "artifactId" = "sbt-scalajs-crossproject"}]
  }
]

# 2. Set commit messages in English
commits.message = "chore(deps): update ${artifactName} from ${currentVersion} to ${nextVersion}"

# 3. Create PRs for updates as soon as possible
pullRequests.frequency = "@asap"

# 4. Disable draft mode
pullRequests.draft = false

# 5. Allow updates for kyo-core, scalajs, and crossproject
updates.allow = [
  { groupId = "io.getkyo", artifactId = "kyo-core" },
  { groupId = "org.scala-js", artifactId = "sbt-scalajs" },
  { groupId = "org.portable-scala", artifactId = "sbt-scalajs-crossproject" }
]

# 6. Add custom labels
pullRequests.customLabels = [ "dependencies", "auto-merge" ]

# 7. Additional settings
scalafmt.runAfterUpgrading = true
signoffCommits = true

# 8. Post-update hook
postUpdateHooks = [{
  command = ["bash", ".github/scripts/bump-version.sh"],
  commitMessage = "chore(deps): update bump version to ${nextVersion}"
}]