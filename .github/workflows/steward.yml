name: Scala Steward
on:
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Run Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          # Use your PAT instead of GITHUB_TOKEN to bypass the "awaiting approval" check
          github-token: ${{ secrets.MY_RELEASE_PAT }}
          repo-config: '.github/scala-steward.conf'